name: Renovate

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * 1"
    - cron: "17 5 * * 1" # second pass merges what turned green
  issues:
    types: [edited]
  pull_request:
    types: [edited]

permissions: {}

concurrency: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    # issue and PR edits only count when they are the bot's own (dashboard and rebase checkboxes)
    if: >-
      (github.event_name != 'issues' || github.event.issue.user.login == 'notcybot-bot[bot]') &&
      (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'notcybot-bot[bot]')
    steps:
      - name: Get app token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ steps.token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM_COMMIT: enabled
