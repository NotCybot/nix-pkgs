name: Renovate

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * 1"
  issues:
    types: [edited]
  pull_request:
    types: [edited]

permissions: {}

concurrency: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    # issue and PR edits only count when they are the bot's own (dashboard and rebase checkboxes)
    if: >-
      (github.event_name != 'issues' || github.event.issue.user.login == 'notcybot-bot[bot]') &&
      (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'notcybot-bot[bot]')
    steps:
      - name: Get app token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM_COMMIT: enabled
