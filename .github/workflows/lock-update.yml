name: Lock Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # app token instead of GITHUB_TOKEN, otherwise the PR does not trigger the build
      - name: Get app token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - run: nix flake update

      - name: Create PR
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.token.outputs.token }}
          branch: chore/update-flake-lock
          commit-message: "chore(deps): update flake lock"
          title: "chore(deps): update flake lock"
          body: Weekly `nix flake update`, merges when the build is green.
          sign-commits: true

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --auto --squash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
